[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "papernym"
dynamic = ["version"]
description = "Rename academic paper PDFs using scholarly metadata"
requires-python = ">=3.10"
dependencies = [
    "pypdfium2>=4.30",
    "requests>=2.28",
    "watchdog>=3.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest"]

[project.scripts]
papernym = "papernym.cli:main"

[project.gui-scripts]
papernym-gui = "papernym.gui.app:main"

[tool.setuptools.dynamic]
version = {attr = "papernym.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"papernym.gui" = ["icons/*.png", "icons/*.ico", "icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
