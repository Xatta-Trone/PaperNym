name: PyPI release

# Builds the Python package (sdist and wheel), checks it, installs the wheel in a clean
# environment, runs the tests, then publishes it with PyPI trusted publishing (no API token
# or password).
#
# Automatic: pushing a version tag (git tag v0.1.3 && git push origin v0.1.3) publishes that
# version to https://pypi.org/project/papernym/, alongside the Windows release workflow.
# The tag must equal papernym.__version__.
#
# By hand, from the Actions tab ("Run workflow"):
#   - target "testpypi" (default) uploads to https://test.pypi.org/project/papernym/
#   - target "pypi" uploads to https://pypi.org/project/papernym/
#   - target "build-only" stops after the checks
# A version can be uploaded to each index only once; bump src/papernym/__init__.py first.
# One-time setup on TestPyPI / PyPI and GitHub: see docs/BUILDING.md, "Publishing to PyPI".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi, build-only]

permissions:
  contents: read

concurrency:
  group: pypi-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # A tag push always goes to PyPI; a manual run goes where it was told.
  TARGET: ${{ github.event_name == 'push' && 'pypi' || inputs.target }}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PaperNym with the GUI and test extras
        run: python -m pip install -e ".[gui,dev]"

      - name: Run the tests
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the build tools
        run: python -m pip install --upgrade pip build twine

      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/papernym/__init__.py').read_text()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match papernym.__version__ $version"
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: python -m build

      - name: Check the package metadata and README
        run: python -m twine check --strict dist/*

      - name: Check what the sdist contains
        run: |
          tar -tzf dist/papernym-*.tar.gz > sdist.txt
          if grep -E "/(prototype|sample_pdfs|packaging|scripts|assets|docs|\.github)/" sdist.txt; then
            echo "::error::the sdist contains files that are not part of the package"
            exit 1
          fi
          echo "sdist files: $(wc -l < sdist.txt)"

      - name: Install the wheel in a clean environment and run the CLI
        env:
          PAPERNYM_KEYRING: "off"
        run: |
          python -m venv /tmp/try
          /tmp/try/bin/python -m pip install dist/papernym-*.whl
          export PAPERNYM_HOME="$(mktemp -d)"
          /tmp/try/bin/papernym --version
          /tmp/try/bin/papernym show
          /tmp/try/bin/papernym formats > /dev/null
          version=$(/tmp/try/bin/python -c "import papernym; print(papernym.__version__)")
          ls dist | grep -q "papernym-$version" || { echo "::error::dist does not match version $version"; exit 1; }
          echo "Built papernym $version (target: $TARGET)" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the built files
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/papernym/
    permissions:
      id-token: write   # trusted publishing
    steps:
      - name: Get the built files
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      - name: Upload to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'push' || inputs.target == 'pypi'
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/papernym/
    permissions:
      id-token: write   # trusted publishing
    steps:
      - name: Get the built files
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
