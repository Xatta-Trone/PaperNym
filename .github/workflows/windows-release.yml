name: Windows release

# Push a version tag (git tag v0.1.0 && git push origin v0.1.0) to build the installer and
# publish it on a GitHub Release. "Run workflow" by hand builds it as an artifact; give an
# existing tag to publish that tag instead. All build logic lives in scripts/build_windows.py.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to build and publish (for example v0.1.0). Leave empty to only build."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PaperNym with the GUI, test and build extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev,build]"

      - name: Check the tag matches the package version
        if: env.RELEASE_TAG != ''
        run: |
          $version = python -c "import papernym; print(papernym.__version__)"
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match papernym.__version__ $version"
          }

      - name: Run the tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Prepare code signing (only if the secret is set)
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
        run: |
          if ($env:SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            "SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          } else {
            Write-Host "No signing certificate configured; building unsigned."
          }

      - name: Build the app and the installer
        env:
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        run: |
          $extra = @()
          if ($env:RELEASE_TAG) { $extra = @("--expected-version", $env:RELEASE_TAG) }
          python scripts/build_windows.py --require-installer @extra

      - name: Upload the installer as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: PaperNym-Setup
          path: |
            dist/PaperNym-Setup-*.exe
            dist/PaperNym-Setup-*.exe.sha256
          if-no-files-found: error

      - name: Publish to the GitHub Release
        if: startsWith(env.RELEASE_TAG, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -Filter "PaperNym-Setup-*" | ForEach-Object { $_.FullName }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --title "PaperNym $($env:RELEASE_TAG.TrimStart('v'))" --generate-notes
          }
          gh release upload $env:RELEASE_TAG @files --clobber
